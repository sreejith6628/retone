name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste API keys or private text. For security issues, use the private reporting link on the issue chooser instead.
  - type: input
    id: version
    attributes:
      label: Retone version
      placeholder: "0.1.2"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Claude (subscription)
        - ChatGPT (subscription)
        - Gemini CLI
        - Anthropic API key
        - OpenAI API key
        - Gemini API key
        - OpenRouter API key
        - Not provider related
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App you were rewriting text in
      placeholder: "e.g. Outlook, Slack, Chrome (Gmail)"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or log output
      render: text
